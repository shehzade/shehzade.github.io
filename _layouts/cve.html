---
layout: default
---

<section class="site-section al-enter">
  <div class="section-head">
    <h3 class="section-title">Vulnerability Advisories</h3>
    <span class="label">Disclosures // CVE Index</span>
  </div>

  <div class="item-list">
    {% for post in site.posts %}
    {% if post.advisory %}
    <div class="list-row al-ticks" style="--al-i: {{ forloop.index }};">
      <div class="list-row-title">
        <a href="{{ post.advisory }}" target="_blank" rel="noopener noreferrer">{{ post.title | escape }}</a>
      </div>
      <div class="list-row-meta">
        <span class="badge-tag badge-acid">{{ post.cve-number }}</span>
        <span>{{ post.date | date: "%B %-d, %Y" }}</span>
        {% if post.advisory_archive %}
        <a href="{{ post.advisory_archive }}" class="badge-tag badge-original" target="_blank" rel="noopener noreferrer">Original</a>
        {% endif %}
      </div>
    </div>
    {% endif %}
    {% endfor %}
  </div>
</section>
