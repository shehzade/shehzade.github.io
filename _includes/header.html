<header class="site-header">
  <div>
    <a href="{{ site.github.url }}/" class="brand-title" id="logo">
      <span class="status-dot" aria-hidden="true"></span><span class="brand-bracket brand-lb">[</span><span class="brand-text-a">SHEHZADE</span><span class="brand-slash">//</span><span class="brand-text-b">ABDULLAH&nbsp;ANSARI</span><span class="brand-bracket brand-rb">]</span>
    </a>
    <div class="brand-subtitle" id="byline" data-text="{{ site.description }}">
      {{ site.description }}
    </div>
  </div>
  <nav class="site-nav">
    {% for item in site.data.settings.menu %}
      {% if item.loc == "internal" %}
      <a href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
      {% elsif item.loc == "external" %}
      <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.name }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
<div class="mrule" aria-hidden="true"></div>
