<header class="site-header">
  <div>
    <a href="{{ site.github.url }}/" class="brand-title">
      SHEHZADE <span class="brand-slash">//</span> ABDULLAH ANSARI
    </a>
    <div class="brand-subtitle">
      {{ site.description }}
    </div>
  </div>
  <nav class="site-nav">
    {% for item in site.data.settings.menu %}
      {% if item.loc == "internal" %}
      <a href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
      {% elsif item.loc == "external" %}
      <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.name }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
<div class="mrule" aria-hidden="true"><i></i></div>
