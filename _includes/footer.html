<footer class="site-footer">
  <div class="footer-social">
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.icon }}</a>
    {% endfor %}
  </div>
  <div class="footer-meta">
    <div class="label" style="display: flex; gap: 12px; align-items: center;">
      <time id="clock" class="text-bone" style="font-variant-numeric: tabular-nums;">00:00:00</time>
      <span>© {{ site.time | date: "%Y" }} Abdullah Ansari (shehzade)</span>
    </div>
    <div class="footer-credit">
      Theme inspired by <a href="https://astralabs.dev" target="_blank" rel="noopener noreferrer">AstraLabs</a>
    </div>
  </div>
</footer>
<div class="reg reg-tl" aria-hidden="true"></div>
<div class="reg reg-br" aria-hidden="true"></div>
